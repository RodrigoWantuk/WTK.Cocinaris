name: Frontend

on:
  push:
    paths:
      - "apps/frontend/**"
      - "packages/api-client/**"
      - "packages/contracts/openapi/**"
      - "scripts/contracts/**"
      - "scripts/frontend/**"
      - "docs/evidence/plan-0015/**"
      - "docs/evidence/plan-0016/**"
      - "docs/plans/PLAN-0015-remediate-frontend-baseline.md"
      - "docs/plans/PLAN-0016-implement-production-session-and-inventory-frontend.md"
      - "docs/plan-status.md"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "apps/frontend/**"
      - "packages/api-client/**"
      - "packages/contracts/openapi/**"
      - "scripts/contracts/**"
      - "scripts/frontend/**"
      - "docs/evidence/plan-0015/**"
      - "docs/evidence/plan-0016/**"
      - "docs/plans/PLAN-0015-remediate-frontend-baseline.md"
      - "docs/plans/PLAN-0016-implement-production-session-and-inventory-frontend.md"
      - "docs/plan-status.md"
      - ".github/workflows/frontend.yml"

defaults:
  run:
    working-directory: apps/frontend

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: yarn
          cache-dependency-path: apps/frontend/yarn.lock
      - name: Install
        run: yarn install --frozen-lockfile
      - name: Install API client package
        working-directory: packages/api-client
        run: yarn install --frozen-lockfile
      - name: Generated API client drift check
        run: yarn check:api-client-drift
      - name: Generated API client typecheck
        run: yarn typecheck:api-client
      - name: API client owned-source format check
        run: yarn format:check:api-client
      - name: Typecheck
        run: yarn typecheck
      - name: Lint
        run: yarn lint
      - name: Format check
        run: yarn format:check
      - name: Test
        run: yarn test
      - name: TypeScript-only source guard
        run: yarn guard:ts-only
      - name: Interactive nesting guard
        run: yarn guard:interactive-nesting
      - name: Build mode guard
        run: yarn guard:build-mode
      - name: Production isolation (static)
        run: yarn guard:production-isolation
      - name: Build (production default)
        run: yarn build
      - name: Inspect production bundle
        run: yarn inspect:production-bundle
      - name: Build prototype
        run: yarn build:prototype
      - name: Build production (explicit)
        run: yarn build:production
      - name: Inspect production bundle (explicit)
        run: yarn inspect:production-bundle
      - name: Third-party HTML/CSS guard (source and production build)
        run: yarn guard:third-party-html
      - name: PLAN-0015 zoom evidence syntax + fail-closed validator
        run: |
          node --check scripts/browser-zoom-200-validation.js
          node ../../scripts/frontend/validate-zoom-evidence.mjs
      - name: Dependency audit (allowlist-aware)
        run: yarn audit:policy

  browser-smoke:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: yarn
          cache-dependency-path: apps/frontend/yarn.lock
      - name: Install
        run: yarn install --frozen-lockfile
      - name: Install Playwright Chromium
        run: yarn smoke:browser:install
      - name: Automated browser smoke
        run: yarn smoke:browser:ci
        env:
          SMOKE_BASE_URL: http://127.0.0.1:3000
          SMOKE_PRODUCTION_URL: http://127.0.0.1:3001
          SMOKE_TESTED_CODE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SMOKE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
      - name: Upload browser smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-report
          path: |
            apps/frontend/docs/browser-smoke/
          if-no-files-found: error
          retention-days: 30